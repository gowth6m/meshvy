name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: |
          # `set -o pipefail`, or the step's exit status is `tee`'s and a build
          # that does not compile reports success. It did exactly that once:
          # 0.10.0 went green here and then failed to build in the release job.
          set -o pipefail
          swift build -c release 2>&1 | tee /tmp/build.log
      - name: No warnings in our own sources
        run: |
          # Scoped to Sources/Meshvy: a dependency's warnings are not ours to
          # fix, and failing on them would make CI red for reasons nobody here
          # can act on.
          if grep "warning:" /tmp/build.log | grep -q "Sources/Meshvy/"; then
            echo "::error::build produced warnings in Sources/Meshvy"
            grep "warning:" /tmp/build.log | grep "Sources/Meshvy/" | head -20
            exit 1
          fi
          echo "clean"
